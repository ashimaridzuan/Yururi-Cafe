<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Yururi Cafe</title>
    <script>
      // GitHub Pages SPA redirect: store path in sessionStorage then redirect to index
      var path = window.location.pathname;
      var base = '/Yururi-Cafe';
      var route = path.replace(base, '') || '/';
      sessionStorage.setItem('spa-redirect', route + window.location.search + window.location.hash);
      window.location.replace(base + '/');
    </script>
  </head>
  <body></body>
</html>
